[project]
name = "credit-risk-modelling"
version = "1.1.0"
description = "Credit scorecard and Probability of Default modelling on LendingClub loans (2007-2011)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
